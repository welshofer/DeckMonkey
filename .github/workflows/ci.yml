name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux build and test (AT-13)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: AT-01 reference decoder accepts our compression
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends make python3 python3-venv >/dev/null
          make snappy-vectors

  macos:
    name: macOS build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: AT-01 reference decoder accepts our compression
        run: make snappy-vectors

  # The Keynote oracle (AT-10, AT-27) needs a logged-in GUI session with Keynote installed and
  # runs on the M4 under the `oracle` label, not on hosted runners.
